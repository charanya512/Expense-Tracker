<<!DOCTYPE html>
<html>
<head>
    <title>View Expenses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Expense List</h2>

    <div class="mb-3">

        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
            Dashboard
        </a>

        <a href="{{ url_for('add_expense') }}" class="btn btn-success">
            Add Expense
        </a>

    </div>

    <table class="table table-bordered table-striped table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Description</th>
                <th>Date</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

        {% for expense in expenses %}

        <tr>

            <td>{{ expense[0] }}</td>
            <td>₹ {{ expense[2] }}</td>
            <td>{{ expense[3] }}</td>
            <td>{{ expense[4] }}</td>
            <td>{{ expense[5] }}</td>

            <td>

                <a href="/edit_expense/{{ expense[0] }}" class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a href="/delete_expense/{{ expense[0] }}" class="btn btn-danger btn-sm">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>

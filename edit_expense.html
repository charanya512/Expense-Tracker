<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2>Edit Expense</h2>

        <form method="POST">

            <div class="mb-3">
                <label>Amount</label>
                <input type="number" step="0.01"
                       name="amount"
                       value="{{ expense[2] }}"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Category</label>
                <input type="text"
                       name="category"
                       value="{{ expense[3] }}"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <input type="text"
                       name="description"
                       value="{{ expense[4] }}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Date</label>
                <input type="date"
                       name="date"
                       value="{{ expense[5] }}"
                       class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">
                Update Expense
            </button>

            <a href="{{ url_for('view_expenses') }}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>

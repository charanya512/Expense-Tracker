<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Expense Tracker</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2>Dashboard</h2>

        <hr>

        <h4>Total Expenses</h4>

        <h2 class="text-danger">₹ {{ total }}</h2>

        <br>

        <div class="d-grid gap-3">

            <a href="{{ url_for('add_expense') }}" class="btn btn-primary">
                ➕ Add Expense
            </a>

            <a href="{{ url_for('view_expenses') }}" class="btn btn-success">
                📋 View Expenses
            </a>

            <a href="{{ url_for('monthly_report') }}" class="btn btn-info">
                📊 Monthly Report
            </a>

            <a href="{{ url_for('export_csv') }}" class="btn btn-dark">
                📥 Export CSV
            </a>

            <a href="{{ url_for('logout') }}" class="btn btn-secondary">
                🚪 Logout
            </a>

        </div>

    </div>

</div>

</body>
</html>
